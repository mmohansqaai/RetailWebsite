# Render Blueprint — API only (deploy from repo root).
# On first deploy, set DATABASE_URL in the dashboard (e.g. from Neon) when prompted.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nova-retail-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Paste your PostgreSQL URL (Neon, Supabase, or Render Postgres) at deploy time:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
