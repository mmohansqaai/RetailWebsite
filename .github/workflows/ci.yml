# Continuous Integration — runs on every push and pull request to main
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          # CI build does not call a real API; client code tolerates empty base URL
          VITE_API_URL: ""

  server:
    name: Server (Prisma + schema)
    runs-on: ubuntu-latest
    env:
      # Schema uses env("DATABASE_URL"); validate/generate do not need a reachable DB
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Prisma validate schema
        working-directory: server
        run: npx prisma validate

      - name: Prisma generate client
        working-directory: server
        run: npx prisma generate
